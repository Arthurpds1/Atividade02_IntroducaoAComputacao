<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <div class="container">
            <h1>RESIDENT EVIL</h1>
        </div>
    </header>

    <main class="container">

        <section class="introducao">
            <h2> Músicas tema das save rooms de Resident Evil 2 e 3</h2>
        </section>

        <section class="galeria">

            <div class="card">
                <figure>
                    <img src="imagens/re2.png" alt="Resident Evil">

                    <figcaption>
                        Resident Evil 2
                    </figcaption>
                </figure>
            </div>

            <div class="card">
                <figure>
                    <img src="imagens/re3.png" alt="Resident Evil 3">

                    <figcaption>
                        Resident Evil 3
                    </figcaption>
                </figure>
            </div>

            <div class="card">

                <figure>
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/53aDI5K49F4?si=RV6yxkc0NDTIxbFl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                    <figcaption>
                        Resident Evil 2 — Save Room
                    </figcaption>
                </figure>

            </div>

            <div class="card">
                <figure>
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/8tMIOyDI_BY?si=ivOPiNQOsGlxD14S" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                    <figcaption>
                        Resident Evil 3 — Save Room 
                    </figcaption>
                </figure>
            </div>

            <div class="card audio-card">
                <figure>
                    <audio controls>
                        <source src="audios/save-room-resident-evil-2.mp3"type=""> Seu navegador não suporta áudio.
                    </audio>
                    <figcaption>
                        Demonstração
                    </figcaption>
                </figure>
            </div>

            <div class="card audio-card">
                <figure>
                    <audio controls>
                        <source src="audios/save-room-resident-evil-3.mp3"type=""> Seu navegador não suporta áudio.
                    </audio>
                    <figcaption>
                        Demonstração 
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer class="rodape">
        <p>RESIDENT EVIL SAVE ROOMS</p>
    </footer>

</body>

</html>
